<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaalTrek - Learn Afrikaans</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <!-- Persistent Header -->
        <header id="app-header">
            <div class="logo">🇿🇦 TaalTrek</div>
            <div class="stats">⭐ <span id="total-stars">0</span></div>
        </header>

        <!-- Home Screen -->
        <div id="home-screen" class="screen active">
            <h2>Kies 'n Les (Choose a Lesson)</h2>
            <div id="lesson-menu"></div>
        </div>

        <!-- Lesson Screen -->
        <div id="lesson-screen" class="screen">
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <h2 id="question-text">Question</h2>
            <div id="options-container"></div>
            <div id="feedback-area" class="hidden">
                <h3 id="feedback-text"></h3>
                <button id="next-btn" class="primary-btn">Next</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h2>Les Voltooi! (Lesson Complete!) 🎉</h2>
            <p>You scored <span id="score-text">0</span> correct.</p>
            <p>⭐ +<span id="earned-stars">0</span> stars added!</p>
            <button id="home-btn" class="primary-btn">Back to Menu</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
