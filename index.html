<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaalTrek - Learn Afrikaans</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <header id="app-header">
            <div class="logo">🇿🇦 TaalTrek</div>
            <div class="stats">⭐ <span id="total-stars">0</span></div>
        </header>

        <!-- Home Screen -->
        <div id="home-screen" class="screen active">
            <h2>Kies 'n Les (Choose a Lesson)</h2>
            <div id="lesson-menu"></div>
        </div>

        <!-- Study Screen -->
        <div id="study-screen" class="screen">
            <h2 id="study-title">Lesson Title</h2>
            <p>Review new words before testing:</p>
            <div id="vocab-list"></div>
            <button id="start-quiz-btn" class="primary-btn">Start Quiz</button>
        </div>

        <!-- Interactive Lesson Screen -->
        <div id="lesson-screen" class="screen">
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <h2 id="question-text">Question</h2>
            
            <!-- Large Play Button for Listening Exercises -->
            <button id="large-play-btn" class="hidden">🔊 Hear Word</button>

            <!-- Multiple Choice UI -->
            <div id="options-container" class="interaction-area"></div>
            
            <!-- Typing UI -->
            <div id="typing-area" class="interaction-area hidden">
                <input type="text" id="typing-input" placeholder="Type your answer in Afrikaans..." autocomplete="off" autocorrect="off" autocapitalize="none">
                <button id="check-typing-btn" class="primary-btn">Check Answer</button>
            </div>

            <div id="feedback-area" class="hidden">
                <div class="feedback-top">
                    <h3 id="feedback-text"></h3>
                    <button id="replay-audio-btn" class="icon-btn hidden">🔊 Hear Again</button>
                </div>
                <button id="next-btn" class="primary-btn">Next</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h2>Les Voltooi! 🎉</h2>
            <p>You scored <span id="score-text">0</span> correct.</p>
            <p>⭐ +<span id="earned-stars">0</span> stars added!</p>
            <button id="home-btn" class="primary-btn">Back to Menu</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
